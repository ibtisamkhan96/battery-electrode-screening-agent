services:
  - type: web
    name: battery-electrode-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    plan: starter
    envVars:
      - key: MP_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LANGCHAIN_API_KEY
        sync: false
      - key: LANGCHAIN_PROJECT
        value: battery-electrode-screening-agent
      - key: API_AUTH_TOKEN
        sync: false
      - key: CORS_ORIGINS
        value: "*"

  - type: web
    name: battery-electrode-ui
    runtime: docker
    dockerfilePath: ./Dockerfile.ui
    plan: starter
    envVars:
      # Set manually after the API service's URL is known, see README/deploy instructions.
      # Not using Render's fromService linking here since it was not possible to verify
      # its exact URL-construction behavior against a live Render account.
      - key: API_BASE_URL
        sync: false
